name: CI Pipeline

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: echo "No tests defined — skipping"

      - name: Build Docker image
        run: docker build -f dockerfile -t express-hello-world .

      - name: Notify success
        if: success()
        run: echo "CI Pipeline SUCCEEDED - Image express-hello-world built successfully!"

      - name: Notify failure
        if: failure()
        run: echo "CI Pipeline FAILED - Check the logs above for details."
